{% comment %}
  Навбар. Авторизация штатная — Django сам знает user.is_authenticated.
{% endcomment %}
<header class="sticky top-0 z-40 border-b border-border bg-background/80 backdrop-blur">
  <div class="mx-auto flex h-16 w-full max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <a href="{% url 'expenses:dashboard' %}" class="flex items-center gap-3">
      <span class="grid size-9 place-items-center rounded-xl bg-primary text-primary-foreground">
        <i data-lucide="wallet" class="size-5"></i>
      </span>
      <span class="text-base font-semibold tracking-tight text-foreground">Кошелёк</span>
    </a>

    {% if user.is_authenticated %}
      <div class="flex items-center gap-3">
        <span class="hidden text-sm text-muted-foreground sm:inline">{{ user.username }}</span>
        <span class="grid size-9 place-items-center rounded-full bg-secondary text-secondary-foreground">
          <i data-lucide="user" class="size-4"></i>
        </span>
        <form method="post" action="{% url 'users:logout' %}">
          {% csrf_token %}
          <button type="submit"
            class="rounded-full border border-border px-3.5 py-2 text-sm font-medium text-muted-foreground transition hover:bg-muted">
            Выйти
          </button>
        </form>
      </div>
    {% else %}
      <nav class="flex items-center gap-2">
        <a href="{% url 'users:login' %}"
          class="flex items-center gap-1.5 rounded-full px-3.5 py-2 text-sm font-medium text-foreground transition hover:bg-muted">
          <i data-lucide="log-in" class="size-4"></i>
          Войти
        </a>
        <a href="{% url 'users:register' %}"
          class="rounded-full bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition hover:opacity-90">
          Регистрация
        </a>
      </nav>
    {% endif %}
  </div>
</header>
