<section class="card">
  <h2>Расходы по категориям</h2>
  <div class="breakdown">
    <div class="breakdown-donut">
      <canvas id="donut" width="180" height="180"></canvas>
    </div>
    <ul class="category-list">
      {% for cat in categories_data %}
      <li>
        <span class="dot" style="background: {{ cat.color }}"></span>
        <span class="cat-name">{{ cat.name }}</span>
        <span class="cat-percent">{{ cat.percent }}%</span>
        <span class="cat-bar"><span style="width: {{ cat.percent }}%; background: {{ cat.color }};"></span></span>
      </li>
      {% empty %}
      <li class="muted">Пока нет расходов за этот месяц</li>
      {% endfor %}
    </ul>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const ctx = document.getElementById('donut');
  const labels = [{% for c in categories_data %}"{{ c.name }}",{% endfor %}];
  const values = [{% for c in categories_data %}{{ c.total }},{% endfor %}];
  const colors = [{% for c in categories_data %}"{{ c.color }}",{% endfor %}];

  if (ctx && labels.length) {
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{ data: values, backgroundColor: colors, borderWidth: 0 }]
      },
      options: { cutout: '70%', plugins: { legend: { display: false } } }
    });
  }
</script>
