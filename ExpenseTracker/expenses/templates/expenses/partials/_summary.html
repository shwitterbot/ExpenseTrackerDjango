{% load tracker_extras %}
<div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
  <div class="rounded-2xl bg-primary p-5 text-primary-foreground shadow-sm">
    <div class="flex items-center gap-2 text-sm/6 text-primary-foreground/80">
      <i data-lucide="wallet" class="size-4"></i>
      Баланс за месяц
    </div>
    <p class="mt-3 font-mono text-3xl font-semibold tracking-tight">{{ balance|rub }}</p>
  </div>

  <div class="rounded-2xl border border-border bg-card p-5 shadow-sm">
    <div class="flex items-center gap-2 text-sm/6 text-muted-foreground">
      <span class="grid size-6 place-items-center rounded-full bg-primary/10 text-primary">
        <i data-lucide="arrow-up-right" class="size-4"></i>
      </span>
      Доходы
    </div>
    <p class="mt-3 font-mono text-3xl font-semibold tracking-tight text-foreground">{{ income|rub }}</p>
  </div>

  <div class="rounded-2xl border border-border bg-card p-5 shadow-sm">
    <div class="flex items-center gap-2 text-sm/6 text-muted-foreground">
      <span class="grid size-6 place-items-center rounded-full bg-destructive/10 text-destructive">
        <i data-lucide="arrow-down-right" class="size-4"></i>
      </span>
      Расходы
    </div>
    <p class="mt-3 font-mono text-3xl font-semibold tracking-tight text-foreground">{{ expenses|rub }}</p>
  </div>
</div>
