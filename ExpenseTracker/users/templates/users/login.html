<div id="loginModal" class="modal">
  <div class="modal-content">
    <h1>Вход</h1>
    <p>Войдите, чтобы вести учёт расходов</p>

    <button id="closeLogin" type="button" class="modal-close">×</button>

    <form method="post" action="{% url 'users:login' %}">
      {% csrf_token %}
      {% for field in login_form %}
        <label>
          <span>{{ field.label }}</span>
          {{ field }}
          {% for error in field.errors %}
            <span class="error">{{ error }}</span>
          {% endfor %}
        </label>
      {% endfor %}
      {% if form.non_field_errors %}
        <p class="error">{{ form.non_field_errors }}</p>
      {% endif %}

      <button type="submit" class="btn-primary">Войти</button>
    </form>

    <p>
      Нет аккаунта?
      <a href="#" id="switchToRegister">Зарегистрироваться</a>
    </p>
    <p>
      <a href="{% url 'users:reset-password' %}">Забыли пароль?</a>
    </p>
  </div>
</div>
