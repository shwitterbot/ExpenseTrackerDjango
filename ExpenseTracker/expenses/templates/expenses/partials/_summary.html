<section class="stats-grid">
  <div class="stat-card stat-balance">
    <div class="stat-label">💳 Баланс за месяц</div>
    <div class="stat-value">{{ balance|floatformat:0 }} ₽</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">↗ Доходы</div>
    <div class="stat-value">{{ income|floatformat:0 }} ₽</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">↘ Расходы</div>
    <div class="stat-value">{{ expense|floatformat:0 }} ₽</div>
  </div>
</section>
