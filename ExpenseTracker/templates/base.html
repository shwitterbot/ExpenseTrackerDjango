{% load static %}
<!DOCTYPE html>
<html lang="ru" class="bg-background">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Кошелёк — трекер расходов{% endblock %}</title>

  <!-- Шрифты Geist -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!--
    Tailwind Play CDN — быстрый старт для разработки.
    Для продакшена соберите Tailwind через django-tailwind или CLI.
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            background: 'oklch(var(--background) / <alpha-value>)',
            foreground: 'oklch(var(--foreground) / <alpha-value>)',
            card: 'oklch(var(--card) / <alpha-value>)',
            'card-foreground': 'oklch(var(--card-foreground) / <alpha-value>)',
            popover: 'oklch(var(--popover) / <alpha-value>)',
            'popover-foreground': 'oklch(var(--popover-foreground) / <alpha-value>)',
            primary: 'oklch(var(--primary) / <alpha-value>)',
            'primary-foreground': 'oklch(var(--primary-foreground) / <alpha-value>)',
            secondary: 'oklch(var(--secondary) / <alpha-value>)',
            'secondary-foreground': 'oklch(var(--secondary-foreground) / <alpha-value>)',
            muted: 'oklch(var(--muted) / <alpha-value>)',
            'muted-foreground': 'oklch(var(--muted-foreground) / <alpha-value>)',
            accent: 'oklch(var(--accent) / <alpha-value>)',
            'accent-foreground': 'oklch(var(--accent-foreground) / <alpha-value>)',
            destructive: 'oklch(var(--destructive) / <alpha-value>)',
            border: 'oklch(var(--border) / <alpha-value>)',
            input: 'oklch(var(--input) / <alpha-value>)',
            ring: 'oklch(var(--ring) / <alpha-value>)',
          },
        },
      },
    }
  </script>

  <link rel="stylesheet" href="{% static 'css/theme.css' %}" />
</head>
<body class="font-sans antialiased">

  {% include "expenses/partials/_nav.html" %}

  {% block content %}{% endblock %}

  <!--
    Lucide-иконки. Это ТОЛЬКО отрисовка SVG (перекрашиваются через currentColor),
    никакой логики приложения. Если нужен полный отказ от JS — замените теги
    <i data-lucide="..."> на <img src="https://unpkg.com/lucide-static/icons/имя.svg">.
  -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
