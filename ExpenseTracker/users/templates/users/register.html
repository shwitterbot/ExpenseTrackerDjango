<div id="registerModal" class="modal">
  <div class="modal-content">
    <h1>Регистрация</h1>
    <p>Создайте аккаунт — стартовые категории добавятся автоматически</p>

    <button id="closeRegister" type="button" class="modal-close">×</button>

    <form method="post" action="{% url 'users:register' %}">
      {% csrf_token %}
      {% for field in register_form %}
        <label>
          <span>{{ field.label }}</span>
          {{ field }}
          {% if register_form.errors %}
          {% if field.help_text %}
            <span class="help">{{ field.help_text|safe }}</span>
          {% endif %}
          {% endif %}

          {% for error in field.errors %}
            <span class="error">{{ error }}</span>
          {% endfor %}
        </label>
      {% endfor %}

      <button type="submit" class="btn-primary">Создать аккаунт</button>
    </form>

    <p>
      Уже есть аккаунт?
      <a href="#" id="switchToLogin">Войти</a>
    </p>
  </div>
</div>
